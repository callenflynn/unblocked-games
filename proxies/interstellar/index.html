<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Proxies - C Unblocked Games</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <h1>🌟 Interstellar Proxies</h1>
        <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>
    </header>

    <div style="text-align: center; padding: 20px;">
        <button class="home-btn" onclick="window.location.href='../index.html'" style="display: inline-block; margin-bottom: 10px;">⬅️ Back to Proxies</button>
        <button class="home-btn" onclick="window.location.href='../../index.html'" style="display: inline-block; margin-bottom: 10px; margin-left: 10px;">🏠 Home</button>
    </div>

    <section class="proxies-section">
        <h2>Select a Interstellar Proxy</h2>
        <p class="proxy-note">⚠️ If one link doesn't work, try another</p>
        <div class="proxy-category">
            <div class="proxy-buttons">
                <button class="proxy-btn" onclick="window.location.href='proxy1.html'">Interstellar 1</button>
                <button class="proxy-btn" onclick="window.location.href='proxy2.html'">Interstellar 2</button>
                <button class="proxy-btn" onclick="window.location.href='proxy3.html'">Interstellar 3</button>
                <button class="proxy-btn" onclick="window.location.href='proxy4.html'">Interstellar 4</button>
                <button class="proxy-btn" onclick="window.location.href='proxy5.html'">Interstellar 5</button>
                <button class="proxy-btn" onclick="window.location.href='proxy6.html'">Interstellar 6</button>
                <button class="proxy-btn" onclick="window.location.href='proxy7.html'">Interstellar 7</button>
                <button class="proxy-btn" onclick="window.location.href='proxy8.html'">Interstellar 8</button>
                <button class="proxy-btn" onclick="window.location.href='proxy9.html'">Interstellar 9</button>
                <button class="proxy-btn" onclick="window.location.href='proxy10.html'">Interstellar 10</button>
                <button class="proxy-btn" onclick="window.location.href='proxy11.html'">Interstellar 11</button>
                <button class="proxy-btn" onclick="window.location.href='proxy12.html'">Interstellar 12</button>
                <button class="proxy-btn" onclick="window.location.href='proxy13.html'">Interstellar 13</button>
                <button class="proxy-btn" onclick="window.location.href='proxy14.html'">Interstellar 14</button>
                <button class="proxy-btn" onclick="window.location.href='proxy15.html'">Interstellar 15</button>
                <button class="proxy-btn" onclick="window.location.href='proxy16.html'">Interstellar 16</button>
                <button class="proxy-btn" onclick="window.location.href='proxy17.html'">Interstellar 17</button>
                <button class="proxy-btn" onclick="window.location.href='proxy18.html'">Interstellar 18</button>
            </div>
        </div>
    </section>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="tabName">Custom Tab Name:</label>
                <input type="text" id="tabName" placeholder="Enter custom tab name">
                <button onclick="applyTabName()">Apply</button>
            </div>
            <div class="setting-group">
                <label>Tab Icon:</label>
                <div class="icon-options">
                    <button class="icon-btn" onclick="setTabIcon('google-classroom')">
                        <img src="https://ssl.gstatic.com/classroom/favicon.png" alt="Google Classroom">
                        <span>Google Classroom</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-docs')">
                        <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" alt="Google Docs">
                        <span>Google Docs</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-drive')">
                        <img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" alt="Google Drive">
                        <span>Google Drive</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('default')">
                        <span>🎮</span>
                        <span>Default</span>
                    </button>
                </div>
            </div>
            <div class="setting-group">
                <label for="customIcon">Custom Icon URL:</label>
                <input type="text" id="customIcon" placeholder="Enter custom icon URL">
                <button onclick="applyCustomIcon()">Apply</button>
            </div>
            <button class="reset-btn" onclick="resetSettings()">Reset to Default</button>
        </div>
    </div>

    <script src="../../script.js"></script>
</body>
</html>
