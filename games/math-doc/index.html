<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Game Links - C Unblocked Games</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <h1>C Unblocked Games</h1>
        <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>
    </header>

    <div class="game-page">
        <aside class="sidebar">
            <button class="home-btn" onclick="window.location.href='../../index.html'">🏠 Home</button>
            <h3 style="margin-bottom: 15px;">Other Games</h3>
            <ul class="game-list" id="gameList">
            </ul>
        </aside>

        <div class="game-container">
            <div class="game-header">
                <h2>Math Game Links</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="fullscreen-btn" onclick="openInBlank('https://docs.google.com/document/d/1HD7vGoNZj75Eqyj4PErlHfBvR2eJiB9B4MetFkUHCGA/edit?usp=sharing')">🔒 Stealth</button>
                    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                </div>
            </div>
            <div class="game-frame">
                <iframe id="game-iframe" src="https://docs.google.com/document/d/1HD7vGoNZj75Eqyj4PErlHfBvR2eJiB9B4MetFkUHCGA/edit?usp=sharing" title="Math Game Links" scrolling="yes" allow="autoplay; payment; fullscreen; microphone; focus-without-user-activation *; screen-wake-lock; gamepad; clipboard-read; clipboard-write; accelerometer; gyroscope;" allowfullscreen="" sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-presentation allow-scripts allow-same-origin allow-downloads allow-popups allow-popups-to-escape-sandbox" loading="eager" importance="high" data-hj-allow-iframe="true" style="border: 0px; margin: 0px; padding: 0px; width: 100%; height: 100%; position: absolute; top: 0px; left: 0px; user-select: none;"></iframe>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="tabName">Custom Tab Name:</label>
                <input type="text" id="tabName" placeholder="Enter custom tab name">
                <button onclick="applyTabName()">Apply</button>
            </div>
            <div class="setting-group">
                <label>Tab Icon:</label>
                <div class="icon-options">
                    <button class="icon-btn" onclick="setTabIcon('google-classroom')">
                        <img src="https://ssl.gstatic.com/classroom/favicon.png" alt="Google Classroom">
                        <span>Google Classroom</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-docs')">
                        <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" alt="Google Docs">
                        <span>Google Docs</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-drive')">
                        <img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" alt="Google Drive">
                        <span>Google Drive</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('default')">
                        <span>🎮</span>
                        <span>Default</span>
                    </button>
                </div>
            </div>
            <div class="setting-group">
                <label for="customIcon">Custom Icon URL:</label>
                <input type="text" id="customIcon" placeholder="Enter custom icon URL">
                <button onclick="applyCustomIcon()">Apply</button>
            </div>
            <button class="reset-btn" onclick="resetSettings()">Reset to Default</button>
        </div>
    </div>

    <script src="../../script.js"></script>
</body>
</html>
