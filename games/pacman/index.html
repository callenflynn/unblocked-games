<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man - C Unblocked Games</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <h1>C Unblocked Games</h1>
        <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>
    </header>

    <div class="game-page">
        <aside class="sidebar">
            <button class="home-btn" onclick="window.location.href='../../index.html'">🏠 Home</button>
            <h3 style="margin-bottom: 15px;">Other Games</h3>
            <ul class="game-list">
                <li><a href="../cubes/index.html">🎮 Falling Cubes</a></li>
                <li><a href="../sudoku/index.html">🔢 Sudoku</a></li>
                <li><a href="../sandtris/index.html">🏖️ Sandtris</a></li>
                <li><a href="../2048/index.html">🎯 2048</a></li>
                <li><a href="../trex/index.html">🦖 T-Rex Runner</a></li>
                <li><a href="../hextris/index.html">🔷 Hextris</a></li>
                <li><a href="../cookie-clicker/index.html">🍪 Cookie Clicker</a></li>
                <li><a href="../flappy-bird/index.html">🐦 Flappy Bird</a></li>
                <li><a href="../breakout/index.html">🧱 Breakout</a></li>
                <li><a href="../snake/index.html">🐍 Snake</a></li>
                <li><a href="../pacman/index.html" class="active">👻 Pac-Man</a></li>
                <li><a href="../minesweeper/index.html">💣 Minesweeper</a></li>
                <li><a href="../space-invaders/index.html">👾 Space Invaders</a></li>
            </ul>
        </aside>

        <div class="game-container">
            <div class="game-header">
                <h2>Pac-Man</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                </div>
            </div>
            <div class="game-frame">
                <iframe style="width:100%; height:100%; border:none;" src="https://shaunew.github.io/Pacman/" title="Pac-Man" allow="fullscreen; autoplay; clipboard-write"></iframe>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="tabName">Custom Tab Name:</label>
                <input type="text" id="tabName" placeholder="Enter custom tab name">
                <button onclick="applyTabName()">Apply</button>
            </div>
            <div class="setting-group">
                <label>Tab Icon:</label>
                <div class="icon-options">
                    <button class="icon-btn" onclick="setTabIcon('google-classroom')">
                        <img src="https://ssl.gstatic.com/classroom/favicon.png" alt="Google Classroom">
                        <span>Google Classroom</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-docs')">
                        <img src="https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico" alt="Google Docs">
                        <span>Google Docs</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('google-drive')">
                        <img src="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" alt="Google Drive">
                        <span>Google Drive</span>
                    </button>
                    <button class="icon-btn" onclick="setTabIcon('default')">
                        <span>🎮</span>
                        <span>Default</span>
                    </button>
                </div>
            </div>
            <div class="setting-group">
                <label for="customIcon">Custom Icon URL:</label>
                <input type="text" id="customIcon" placeholder="Enter custom icon URL">
                <button onclick="applyCustomIcon()">Apply</button>
            </div>
            <button class="reset-btn" onclick="resetSettings()">Reset to Default</button>
        </div>
    </div>

    <script src="../../script.js"></script>
</body>
</html>
